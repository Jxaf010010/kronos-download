name: Download Kronos Weights

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Kronos models from HuggingFace
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download

          repos = [
              "NeoQuasar/Kronos-Tokenizer-2k",
              "NeoQuasar/Kronos-small",
              "NeoQuasar/Kronos-base",
          ]
          for repo in repos:
              name = repo.split("/")[-1]
              snapshot_download(repo_id=repo, local_dir=f"kronos_models/{name}")
              print("downloaded", repo)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kronos-models-more
          path: kronos_models/
